name: smart_fox
description: SNI Spoofing VPN application for Android, Windows, and Linux

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  provider: ^6.1.2
  
  # Serialization
  json_annotation: ^4.9.0
  
  # Storage
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  
  # FFI for native code
  ffi: ^2.1.2
  
  # Utilities
  collection: ^1.18.0
  intl: ^0.19.0
  
  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
